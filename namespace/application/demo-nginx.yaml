# Demo application used to prove that the GitOps loop works:
# a change pushed to this file appears in the cluster without anyone running
# kubectl or terraform.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
  namespace: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nginx
  namespace: application
spec:
  type: ClusterIP
  selector:
    app: demo-nginx
  ports:
    - port: 80
      targetPort: 80
